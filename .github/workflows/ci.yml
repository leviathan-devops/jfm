name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: install
        run: bun install --frozen-lockfile
      - name: build
        run: bun run build
      - name: unit tests
        run: bun run test
